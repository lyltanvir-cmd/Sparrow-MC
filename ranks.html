<style>
body{
background:#05010a;
color:white;
font-family:Arial,sans-serif;
overflow-x:hidden;
}

/* Background Glow */
.bg-glow{
position:fixed;
width:600px;
height:600px;
background:#ef4444;
filter:blur(180px);
opacity:0.12;
top:-200px;
right:-200px;
z-index:-1;
}

/* Cards */
.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(239,68,68,0.15);
backdrop-filter:blur(12px);
transition:0.35s;
position:relative;
overflow:hidden;
}

.card:hover{
transform:translateY(-8px) scale(1.02);
border-color:#ef4444;
box-shadow:0 0 40px rgba(239,68,68,0.45);
}

/* Shine Effect */
.card::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,0.08),
transparent
);
transition:0.6s;
}

.card:hover::before{
left:100%;
}

/* Buttons */
.buy-btn{
background:linear-gradient(90deg,#dc2626,#ef4444);
transition:0.3s;
}

.buy-btn:hover{
transform:scale(1.04);
box-shadow:0 0 25px rgba(239,68,68,0.7);
}

/* Glow */
.glow{
text-shadow:
0 0 10px #ef4444,
0 0 20px #ef4444,
0 0 40px #ef4444;
}

/* Navbar */
.nav-link{
transition:0.3s;
}

.nav-link:hover{
color:#f87171;
}

/* Premium Card */
.best{
border:2px solid #ef4444;
box-shadow:0 0 35px rgba(239,68,68,0.3);
}
</style>
</head>
